                            <i class="icon-arrow-narrow-left"></i>
                        </a>
                        <h6 class="title fw-5">

                        <a href="index-2.html" class="btn-right">
                            <i class="icon-home"></i>
                        </a>
                    </div>
                </div>
            </div>
            <div class="tf-container">
                <form action="#" class="form-change-password">
                    <fieldset class="mb-16">
                        <label for="current-password" class="text-medium color-paragraph-2 mb-6">Current

                        <div class="box-auth-pass mb-12 tf-field">
                            <input type="password" placeholder=" " class="password-field style-border"

                                <span class="icon-eye-off"></span>
                            </span>
                        </div>
                    </fieldset>
                    <fieldset class="mb-16">
                        <label for="new-password" class="text-medium color-paragraph-2 mb-6">Password</label>
                        <div class="box-auth-pass mb-12 tf-field">
                            <input type="password" placeholder=" " class="password-field style-border" id="new-password"
                                value="123456" required>
                            <span class="show-pass">
                                <span class="icon-eye"></span>
                                <span class="icon-eye-off"></span>
                            </span>
                        </div>
                    </fieldset>
                    <fieldset class="mb-16">
                        <label for="confirmed-password" class="text-medium color-paragraph-2 mb-6">Confirmed
                            Password</label>
                        <div class="box-auth-pass mb-12 tf-field">
                            <input type="password" placeholder=" " class="password-field style-border"

                                <span class="icon-eye-off"></span>
                            </span>
