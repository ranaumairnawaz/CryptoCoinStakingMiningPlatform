                    </div>
                </div>

                <div class="wg-profile-settings add-profile">
                    <div class="image mb-20">

                        <div class="icon">
                            <input id="file-input" class="input-absolute" type="file">

                                <label class="text-medium" for="first-name">First Name</label>
                                <input type="text" class="text-medium" placeholder="First Name" id="first-name" value="Grace"

                            <label class="text-medium" for="email-profile">Email Address</label>
                            <input type="email" class="text-medium" placeholder="Email Address" id="email-profile" value="graceturner@gmail.com"

                                    </select>
                                </div>
                                <input type="number" class="text-medium" value="7077970462" id="phone" required>
