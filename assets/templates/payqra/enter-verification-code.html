<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover">

    <!-- font -->
    <link rel="stylesheet" href="fonts/fonts.css">
    <!-- Icons -->
    <link rel="stylesheet" href="icons/icomoon/style.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="css/styles.css" />


    <!-- Favicon and Touch Icons  -->
    <link rel="shortcut icon" href="images/logo/40.png" />
    <link rel="apple-touch-icon-precomposed" href="images/logo/40.png" />

    <title>PayQra</title>
</head>

<body>
    <!-- preloade -->
    <div class="preload preload-container">
        <div class="logo-img">
            <img src="images/logo/logo.svg" alt="">
        </div>
        <div class="spinner-circle lg success">
            <span class="spinner-circle1 spinner-child"></span>
            <span class="spinner-circle2 spinner-child"></span>
            <span class="spinner-circle3 spinner-child"></span>
            <span class="spinner-circle4 spinner-child"></span>
            <span class="spinner-circle5 spinner-child"></span>
            <span class="spinner-circle6 spinner-child"></span>
            <span class="spinner-circle7 spinner-child"></span>
            <span class="spinner-circle8 spinner-child"></span>
            <span class="spinner-circle9 spinner-child"></span>
        </div>
    </div>
    <!-- /preload -->
    <div class="wrap">
        <div class="tf-container">
            <div class="wg-verification">
                <div class="image-verification-forgot">
                    <img loading="lazy" alt="img" width="96" height="96" src="images/sign-up/empty-state.png"
                        class="img-1">
                    <div class="icon">
                        <i class="icon-mail"></i>
                        <span class="dot-error"></span>
                    </div>
                </div>

                <form class="from-verification-forgot">
                    <h4 class="title">
                        Almost there!
                    </h4>
                    <div class="sub-title">
                        Check your email inbox and input the verification code to verify your account.
                    </div>
                    <div class="digit-group">
                        <input required type="text" id="digit-1" name="digit-1" data-next="digit-2" value="7">
                        <input required type="text" id="digit-2" name="digit-2" data-next="digit-3"
                            data-previous="digit-1" value="5">
                        <input required type="text" id="digit-3" name="digit-3" data-next="digit-4"
                            data-previous="digit-2" value="0">
                        <input required type="text" id="digit-4" name="digit-4" data-next="digit-5"
                            data-previous="digit-3">
                        <input required type="text" id="digit-5" name="digit-5" data-next="digit-6"
                            data-previous="digit-4">
                    </div>
                </form>
                
                <div class="fixed-bottom-btn">
                    <div class="tf-container">
                        <a href="enable-fingerprint.html" class="tf-btn primary mb-16">Continue</a>
                        <a href="#" class="tf-btn style-border border-primary-100">Resend Code</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script type="text/javascript" src="js/jquery.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.min.js"></script>
    <script type="text/javascript" src="js/count-down.js"></script>
    <script type="text/javascript" src="js/main.js"></script>

</body>
