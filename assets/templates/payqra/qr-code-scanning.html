    <!-- font -->
    <link rel="stylesheet" href="fonts/fonts.css">
    <!-- Icons -->
    <link rel="stylesheet" href="icons/icomoon/style.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-select.min.css">
    <link rel="stylesheet" href="css/swiper-bundle.min.css">

    <link rel="shortcut icon" href="images/logo/40.png" />
    <link rel="apple-touch-icon-precomposed" href="images/logo/40.png" />

    <title>boarding</title>

<body>
    <!-- preloade -->
    <div class="preload preload-container">
        <div class="logo-img">
            <img src="images/logo/logo.svg" alt="">
        </div>
        <div class="spinner-circle lg success">
            <span class="spinner-circle1 spinner-child"></span>
            <span class="spinner-circle2 spinner-child"></span>
            <span class="spinner-circle3 spinner-child"></span>
            <span class="spinner-circle4 spinner-child"></span>
            <span class="spinner-circle5 spinner-child"></span>
            <span class="spinner-circle6 spinner-child"></span>
            <span class="spinner-circle7 spinner-child"></span>
            <span class="spinner-circle8 spinner-child"></span>
            <span class="spinner-circle9 spinner-child"></span>
        </div>
    </div>
    <!-- /preload -->
    <div class="wrap">
        <div class="wg-qr-code-scan">
            <div class="header-2 mb-12 header-fix">
                <div class="tf-container">
                    <div class="header-content">
                        <a href="#" class="tf-btn-arrow back-btn">
                            <i class="icon-arrow-narrow-left"></i>
                        </a>
                        <h6 class="title fw-5">
                            QR Code
                        </h6>
                    </div>
                </div>
            </div>
            <div class="wrap-scan-camera overflow-auto">
                <div class="tf-container"></div>
            </div>
            <div class="tf-panel scan panel-open">
                <div class="panel_overlay"></div>
                <div class="panel-box panel-up wrap-scan-qr">
                    <div class="logo-qr">
                        <img loading="lazy" width="294" height="277" src="images/icons/qr-code-line.png" alt="Image">
                    </div>
                </div>
                <div class="box-scan-notification">
                    <i class="icon-noti"></i>
                    <p>Point your camera at the QR code to make a payment</p>
                </div>
            </div>
        </div>
    </div>
    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/count-down.js"></script>

    <script src="js/swiper-bundle.min.js"></script>
